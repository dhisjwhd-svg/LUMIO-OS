<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LUMIO-OS</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #desktop{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505;display:block}
  #status{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;background:#050505;z-index:2}
  #status[hidden]{display:none}
  .mark{width:34px;height:34px;margin:0 auto 8px;border:2px solid #292929;border-top-color:#f4f4f4;border-radius:50%;animation:spin .8s linear infinite}
  h1{font-size:18px;font-weight:600;letter-spacing:.02em;margin:0}
  p{font-size:13px;color:#9a9a9a;margin:0;line-height:1.5}
  button{justify-self:center;margin-top:8px;padding:10px 16px;border:1px solid #393939;border-radius:10px;background:#171717;color:#fff;font:inherit;cursor:pointer}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.mark{animation:none}}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<main id="status" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true"></div>
  <h1 id="heading">Starting LUMIO-OS</h1>
  <p id="message">Loading the desktop…</p>
  <button id="retry" type="button" hidden>Try again</button>
</main>
<script>
(() => {
  const desktop = document.getElementById('desktop');
  const status = document.getElementById('status');
  const heading = document.getElementById('heading');
  const message = document.getElementById('message');
  const retry = document.getElementById('retry');

  // Fetch the current main-branch desktop on every launch.
  // A unique query string helps bypass browser/CDN caches after GitHub updates.
  const desktopSources = [
    'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html',
    'https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/Assets/lumio-desktop.html'
  ];

  async function start() {
    retry.hidden = true;
    heading.textContent = 'Starting LUMIO-OS';
    message.textContent = 'Loading the latest desktop…';
    status.hidden = false;

    let lastError;
    const cacheKey = 'v=' + Date.now();
    for (const baseUrl of desktopSources) {
      try {
        const separator = baseUrl.includes('?') ? '&' : '?';
        const url = baseUrl + separator + cacheKey;
        const response = await fetch(url, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const html = await response.text();

        // Avoid replacing the working view with an error page or incomplete response.
        if (!/<html[\\s>]/i.test(html) || !/<body[\\s>]/i.test(html) || !/<\\/html\\s*>/i.test(html) || html.length < 10000) {
          throw new Error('The downloaded desktop file was incomplete.');
        }

        desktop.onload = () => { status.hidden = true; };
        desktop.srcdoc = html;
        // Reveal after the srcdoc document begins rendering.
        window.setTimeout(() => { status.hidden = true; }, 400);
        return;
      } catch (error) {
        lastError = error;
      }
    }

    heading.textContent = 'LUMIO-OS could not load';
    message.textContent = 'Could not fetch the latest desktop. Check your connection and tap Try again.';
    retry.hidden = false;
    console.error('LUMIO-OS launch failed:', lastError);
  }

  retry.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
