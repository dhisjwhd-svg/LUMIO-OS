<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LUMIO-OS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#status{position:fixed;inset:0;display:grid;place-content:center;background:#050505;color:#aaa;font:14px system-ui,sans-serif}
#status[hidden]{display:none}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="status" role="status">Loading LUMIO-OS…</div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html';
  const base='https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/';
  const frame=document.getElementById('desktop');
  const status=document.getElementById('status');
  try{
    const response=await fetch(source+'?v='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    if(!/^\s*(?:<!doctype\s+html|<html\b)/i.test(html)) throw new Error('Invalid HTML response');
    const tag='<base href="'+base+'">';
    html=/<base\b[^>]*>/i.test(html)
      ?html.replace(/<base\b[^>]*>/i,tag)
      :html.replace(/<head\b[^>]*>/i,match=>match+'\n'+tag);
    frame.onload=()=>{status.hidden=true};
    frame.srcdoc=html;
  }catch(error){
    status.textContent='Could not load LUMIO-OS. Check your connection and reload.';
    console.error('LUMIO-OS load failed:',error);
  }
})();
</script>
</body>
</html>
