<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LUMIO-OS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#status{position:fixed;inset:0;display:grid;place-content:center;background:#050505;color:#aaa;font:14px system-ui,sans-serif;z-index:2}
#status[hidden]{display:none}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="status" role="status">Loading LUMIO-OS…</div>
<script>
(function(){
  const frame=document.getElementById('desktop');
  const status=document.getElementById('status');
  const source='https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html';
  let settled=false;
  const timeout=window.setTimeout(function(){
    if(settled)return;
    status.textContent='LUMIO-OS is taking longer than expected. Check your connection, then reload.';
  },12000);
  frame.addEventListener('load',function(){
    settled=true;
    window.clearTimeout(timeout);
    status.hidden=true;
  },{once:true});
  frame.addEventListener('error',function(){
    settled=true;
    window.clearTimeout(timeout);
    status.textContent='Could not load LUMIO-OS. Check your connection and reload.';
  },{once:true});
  // Load the desktop as a real document instead of copying it into srcdoc.
  // This preserves its own document origin, script lifecycle, and storage behavior.
  frame.src=source+'?v='+Date.now();
})();
</script>
</body>
</html>
