<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LUMIO-OS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#loading{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;background:#050505;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading.off{display:none}.spinner{width:28px;height:28px;border:2px solid #333;border-top-color:#ddd;border-radius:50%;margin:auto;animation:spin .8s linear infinite}
p{color:#999;max-width:320px;line-height:1.5}button{padding:10px 15px;border:1px solid #444;border-radius:9px;background:#191919;color:white;font:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="loading"><div class="spinner"></div><strong>Starting LUMIO-OS</strong><p id="message">Loading desktop…</p><button id="retry" hidden>Try again</button></div>
<script>
(() => {
  const frame = document.getElementById('desktop');
  const loading = document.getElementById('loading');
  const message = document.getElementById('message');
  const retry = document.getElementById('retry');
  const sourceUrl = 'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html';
  const assetBase = 'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/';

  async function start() {
    retry.hidden = true;
    message.textContent = 'Loading desktop…';
    loading.classList.remove('off');
    frame.removeAttribute('src');
    try {
      const response = await fetch(sourceUrl + '?v=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      let html = await response.text();
      if (!/^\s*(?:<!doctype\s+html|<html\b)/i.test(html)) {
        throw new Error('The raw URL did not return an HTML document.');
      }

      // Preserve the original document's relative asset paths when embedding it.
      const baseTag = '<base href="' + assetBase + '">';
      if (/<head\b[^>]*>/i.test(html)) {
        html = html.replace(/<head\b([^>]*)>/i, match => match + '\n' + baseTag);
      } else {
        html = '<head>' + baseTag + '</head>' + html;
      }

      frame.onload = () => loading.classList.add('off');
      frame.srcdoc = html;
      window.setTimeout(() => loading.classList.add('off'), 1800);
    } catch (error) {
      message.textContent = 'Could not load the desktop. Check your connection and try again.';
      retry.hidden = false;
      console.error('LUMIO-OS launch failed:', error);
    }
  }
  retry.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
