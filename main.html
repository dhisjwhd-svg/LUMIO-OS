<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LUMIO-OS</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#fallback{position:fixed;inset:0;display:none;place-content:center;gap:12px;padding:24px;text-align:center;background:#050505;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#fallback.show{display:grid}
h1{margin:0;font-size:18px}
p{max-width:360px;margin:0;color:#aaa;line-height:1.5}
a{color:#d99ab4}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<main id="fallback">
  <h1>LUMIO-OS could not open</h1>
  <p>Open the desktop directly using the rendered HTML link below.</p>
  <a id="direct" href="https://raw.githack.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html">Open LUMIO-OS desktop</a>
</main>
<script>
(() => {
  const frame = document.getElementById('desktop');
  const fallback = document.getElementById('fallback');

  // IMPORTANT: use a host that serves the file as text/html.
  // jsDelivr and raw.githubusercontent.com can serve HTML as plain text in
  // some contexts, which makes the browser display the markup instead of run it.
  // Do not use fetch()+srcdoc here: the desktop is a large, complete document
  // with its own scripts and app logic; let the browser load it as a real page.
  const renderedDesktop = 'https://raw.githack.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html';

  frame.addEventListener('load', () => {
    // A cross-origin iframe's load event fires even for many error documents,
    // so do not use it as proof of success or switch sources on load.
    fallback.classList.remove('show');
  });

  frame.src = renderedDesktop;
  document.getElementById('direct').href = renderedDesktop;
})();
</script>
</body>
</html>
