<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>LUMIO-OS</title>
<style>
:root{color-scheme:dark;background:#050505}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#status{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#050505;color:#b7b7bd;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#status[hidden]{display:none}
#status p{margin:0;color:#a5a5ad}
#retry{margin-top:16px;padding:9px 14px;border:1px solid #38383f;border-radius:9px;background:#151519;color:#f5f5f7;font:inherit;cursor:pointer}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-read; clipboard-write"></iframe>
<div id="status" role="status" aria-live="polite"><div><p id="statusText">Starting LUMIO-OS…</p><button id="retry" type="button" hidden>Try again</button></div></div>
<script>
(()=> {
  'use strict';
  const frame=document.getElementById('desktop');
  const status=document.getElementById('status');
  const statusText=document.getElementById('statusText');
  const retry=document.getElementById('retry');
  const sources=[
    'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html'
  ];
  let attempt=0;
  function loadDesktop(){
    attempt++;
    status.hidden=false;
    statusText.textContent='Starting LUMIO-OS…';
    retry.hidden=true;
    frame.onload=()=>{status.hidden=true;};
    frame.onerror=()=>{
      statusText.textContent='LUMIO-OS could not load. Check your connection and retry.';
      retry.hidden=false;
    };
    frame.src=sources[0]+'?v='+Date.now();
  }
  retry.addEventListener('click',loadDesktop);
  loadDesktop();
})();
</script>
</body>
</html>
