<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LUMIO-OS — Latest Desktop</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#status{position:fixed;inset:0;display:grid;place-items:center;background:#050505;color:#aaa;font:14px system-ui,sans-serif;z-index:2;padding:24px;text-align:center}
#status[hidden]{display:none}
.status-card{max-width:420px;line-height:1.6}
#retry{margin-top:16px;padding:10px 16px;border:1px solid #555;border-radius:9px;background:#171717;color:#f4f4f4;font:inherit;cursor:pointer}
#retry:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="status" role="status" aria-live="polite">Loading the latest LUMIO-OS…</div>
<script>
(function(){
  const frame=document.getElementById('desktop');
  const status=document.getElementById('status');
  const sources=[
    'https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/Assets/lumio-desktop.html',
    'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html'
  ];
  const assetBase='https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/Assets/';
  let requestId=0;
  function showLoading(){
    status.hidden=false;
    status.textContent='Loading the latest LUMIO-OS…';
  }
  function showError(){
    status.hidden=false;
    status.innerHTML='<div class="status-card">LUMIO-OS could not load. Check your connection and try again.<br><button id="retry" type="button">Retry loading</button></div>';
    document.getElementById('retry').addEventListener('click',loadDesktop);
  }
  async function fetchLatest(url){
    const response=await fetch(url+(url.includes('?')?'&':'?')+'_lumio='+Date.now(),{cache:'no-store'});
    if(!response.ok) throw new Error('Desktop request failed: HTTP '+response.status);
    const html=await response.text();
    if(!/<html[\s>]/i.test(html)||!/<head[\s>]/i.test(html)||!/<body[\s>]/i.test(html)||!/<\/html\s*>/i.test(html)||html.length<10000||!/id=["']appLayer["']/i.test(html)||!/function\s+openApp\s*\(/.test(html)||!/milkbox:\s*['"]https:\/\/milkbox\.b-cdn\.net\//i.test(html)||!/targetFrame\.src\s*=\s*url/i.test(html)||!/setAttribute\(['"]sandbox['"],\s*['"][^'"]*allow-scripts/i.test(html)||/if\s*\(key\s*===\s*['"]milkbox['"]\)[\s\S]{0,1200}?allow-popups/i.test(html)||/if\s*\(key\s*===\s*['"]milkbox['"]\)[\s\S]{0,1200}?allow-top-navigation/i.test(html)) throw new Error('Desktop response was incomplete or MilkBox is not confined to the in-app iframe.');
    return html;
  }
  async function loadDesktop(){
    const id=++requestId;
    showLoading();
    let html,lastError;
    for(const source of sources){
      try { html=await fetchLatest(source); break; }
      catch(error){ lastError=error; }
    }
    if(id!==requestId) return;
    if(!html){
      console.error('LUMIO-OS load failed:',lastError);
      showError();
      return;
    }
    const base='<base href="'+assetBase+'">';
    if(/<head(?:\s[^>]*)?>/i.test(html)) html=html.replace(/<head(?:\s[^>]*)?>/i,match=>match+base);
    else {
      console.error('LUMIO-OS response has no head element.');
      showError();
      return;
    }
    frame.onload=function(){ if(id===requestId) status.hidden=true; };
    frame.srcdoc=html;
  }
  loadDesktop();
})();
</script>
</body>
</html>
