<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LUMIO-OS</title>
<style>
*{box-sizing:border-box}html,body,#lumio{width:100%;height:100%;margin:0}body{background:#050505;color:#eee;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}#lumio{display:block;border:0;background:#050505}.status{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#17151e,#050505 65%);color:#aaa}.mark{font-size:22px;font-weight:800;letter-spacing:.16em;color:#f6f4ff}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#b6a2ff;margin-right:9px;box-shadow:0 0 14px #b6a2ff;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25}}.error{max-width:440px;padding:24px}.error a{color:#c7b8ff}
</style>
</head>
<body>
<div class="status" id="status" role="status" aria-live="polite"><div class="mark">LUMIO</div><div><span class="dot"></span>Loading desktop…</div></div>
<iframe id="lumio" title="LUMIO-OS desktop" hidden allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<script>
(function(){
  'use strict';
  var status=document.getElementById('status');
  var frame=document.getElementById('lumio');
  var sources=[
    'https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/lumio-desktop.html',
    'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/lumio-desktop.html'
  ];
  function load(index){
    if(index>=sources.length){
      status.innerHTML='<div class="error"><div class="mark">LUMIO</div><p>Could not load the desktop. Check your internet connection and try again.</p><p><a href="'+sources[0]+'" target="_blank" rel="noopener">Open desktop source</a> · <a href="" onclick="location.reload();return false">Retry</a></p></div>';
      return;
    }
    fetch(sources[index],{cache:'default'}).then(function(response){
      if(!response.ok) throw new Error('HTTP '+response.status);
      return response.text();
    }).then(function(html){
      if(!/<html[\s>]/i.test(html)||!/<body[\s>]/i.test(html)) throw new Error('Unexpected document');
      frame.srcdoc=html;
      frame.hidden=false;
      status.remove();
    }).catch(function(){load(index+1);});
  }
  load(0);
})();
</script>
</body>
</html>
