<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<title>LUMIO-OS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#loading{position:fixed;inset:0;z-index:10;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:24px;background:#050505;color:#eee;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#loading.off{display:none}
.spinner{width:28px;height:28px;border:2px solid #333;border-top-color:#ddd;border-radius:50%;animation:spin .8s linear infinite}
p{color:#999;max-width:320px;line-height:1.5;margin:0}
button{padding:10px 15px;border:1px solid #444;border-radius:9px;background:#191919;color:white;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="loading" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <strong>Starting LUMIO-OS</strong>
  <p id="message">Checking for the latest desktop…</p>
  <p id="version" hidden></p>
  <button id="retry" type="button" hidden>Try again</button>
</div>
<script>
(() => {
  'use strict';
  const frame = document.getElementById('desktop');
  const loading = document.getElementById('loading');
  const message = document.getElementById('message');
  const versionLabel = document.getElementById('version');
  const retry = document.getElementById('retry');

  const owner = 'dhisjwhd-svg';
  const repo = 'LUMIO-OS';
  const branch = 'main';
  const filePath = 'Assets/lumio-desktop.html';
  const apiUrl = 'https://api.github.com/repos/' + owner + '/' + repo +
    '/commits?path=' + encodeURIComponent(filePath) + '&per_page=1';
  const rawBase = 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/';
  const branchUrl = rawBase + branch + '/' + filePath;

  async function fetchText(url) {
    const response = await fetch(url, {
      cache: 'no-store',
      headers: { 'Accept': 'text/plain, application/vnd.github+json' }
    });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.text();
  }

  async function getLatestSource() {
    // Resolve the latest commit for the desktop file first, then fetch that exact
    // revision so the embedded page and displayed version always match.
    try {
      const commitsText = await fetchText(apiUrl);
      const commits = JSON.parse(commitsText);
      if (!Array.isArray(commits) || !commits[0] || !commits[0].sha) {
        throw new Error('GitHub did not return a desktop revision.');
      }
      const sha = commits[0].sha;
      const url = rawBase + sha + '/' + filePath;
      return { html: await fetchText(url), version: sha, url };
    } catch (apiError) {
      // If the API is rate-limited or unavailable, still load the current main branch.
      const html = await fetchText(branchUrl + '?v=' + Date.now());
      return { html, version: 'main (latest available)', url: branchUrl };
    }
  }

  function embedBaseUrl(html, baseUrl) {
    const baseTag = '<base href="' + baseUrl + '">';
    if (/<base\b/i.test(html)) {
      return html.replace(/<base\b[^>]*>/i, baseTag);
    }
    if (/<head\b[^>]*>/i.test(html)) {
      return html.replace(/<head\b[^>]*>/i, match => match + '\n' + baseTag);
    }
    return '<head>' + baseTag + '</head>' + html;
  }

  async function start() {
    retry.hidden = true;
    versionLabel.hidden = true;
    message.textContent = 'Checking for the latest desktop…';
    loading.classList.remove('off');
    frame.removeAttribute('src');
    frame.removeAttribute('srcdoc');

    try {
      const latest = await getLatestSource();
      if (!/^\s*(?:<!doctype\s+html|<html\b)/i.test(latest.html)) {
        throw new Error('The raw GitHub URL did not return an HTML document.');
      }

      const html = embedBaseUrl(latest.html, rawBase + branch + '/Assets/');
      frame.onload = () => {
        loading.classList.add('off');
        versionLabel.textContent = 'Desktop revision: ' + latest.version;
        versionLabel.hidden = false;
      };
      frame.srcdoc = html;

      // Avoid trapping the user on the loader if a browser does not fire iframe onload.
      window.setTimeout(() => {
        if (frame.srcdoc) loading.classList.add('off');
      }, 2500);
    } catch (error) {
      message.textContent = 'Could not load LUMIO-OS. Check your internet connection and try again.';
      retry.hidden = false;
      console.error('LUMIO-OS launch failed:', error);
    }
  }

  retry.addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
