<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMIO-OS</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#desktop{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
#status{position:fixed;inset:0;display:grid;place-items:center;background:#050505;color:#aaa;font:14px system-ui,sans-serif;z-index:2}
#status[hidden]{display:none}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
<div id="status" role="status">Loading LUMIO-OS…</div>
<script>
(async function(){
  const frame=document.getElementById('desktop');
  const status=document.getElementById('status');
  const source='https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/Assets/lumio-desktop.html';
  try {
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    const base='<base href="https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/Assets/">';
    if(/<head(?:\s[^>]*)?>/i.test(html)) html=html.replace(/<head(?:\s[^>]*)?>/i,match=>match+base);
    else html=base+html;
    frame.srcdoc=html;
    frame.addEventListener('load',()=>{status.hidden=true;},{once:true});
  } catch(error) {
    status.textContent='LUMIO-OS could not load. Check your connection and reload.';
    console.error('LUMIO-OS load failed:',error);
  }
})();
</script>
</body>
</html>
