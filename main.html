<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LUMIO-OS</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #desktop{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505;display:block}
  #status{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;padding:24px;background:#050505;z-index:2}
  #status[hidden]{display:none}
  .mark{width:34px;height:34px;margin:0 auto 8px;border:2px solid #292929;border-top-color:#f4f4f4;border-radius:50%;animation:spin .8s linear infinite}
  h1{font-size:18px;font-weight:600;letter-spacing:.02em;margin:0}
  p{font-size:13px;color:#9a9a9a;margin:0;line-height:1.5;max-width:340px}
  button{justify-self:center;margin-top:8px;padding:10px 16px;border:1px solid #393939;border-radius:10px;background:#171717;color:#fff;font:inherit;cursor:pointer}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.mark{animation:none}}
</style>
</head>
<body>
<iframe id="desktop" title="LUMIO-OS desktop" allow="fullscreen; clipboard-read; clipboard-write" referrerpolicy="no-referrer"></iframe>
<main id="status" role="status" aria-live="polite">
  <div class="mark" aria-hidden="true"></div>
  <h1 id="heading">Starting LUMIO-OS</h1>
  <p id="message">Opening the latest desktop…</p>
  <button id="retry" type="button" hidden>Try again</button>
</main>
<script>
(() => {
  const desktop = document.getElementById('desktop');
  const status = document.getElementById('status');
  const heading = document.getElementById('heading');
  const message = document.getElementById('message');
  const retry = document.getElementById('retry');

  // Navigate directly to the hosted HTML instead of fetch()+srcdoc.
  // This avoids CORS failures when main.html is opened from a local file.
  // jsDelivr serves .html with a browser-friendly content type and tracks main.
  const sources = [
    'https://cdn.jsdelivr.net/gh/dhisjwhd-svg/LUMIO-OS@main/Assets/lumio-desktop.html',
    'https://raw.githack.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html',
    'https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/Assets/lumio-desktop.html'
  ];
  let attempt = 0;
  let loadTimer;

  function showFailure() {
    clearTimeout(loadTimer);
    heading.textContent = 'LUMIO-OS could not load';
    message.textContent = 'The hosted desktop did not respond. Check your connection, then try again.';
    retry.hidden = false;
    status.hidden = false;
  }

  function loadNext() {
    clearTimeout(loadTimer);
    if (attempt >= sources.length) {
      showFailure();
      return;
    }

    const source = sources[attempt++];
    heading.textContent = 'Starting LUMIO-OS';
    message.textContent = 'Opening the latest desktop…';
    retry.hidden = true;
    status.hidden = false;

    // Cache-bust the CDN URL so updates on main are picked up promptly.
    desktop.src = source + (source.includes('?') ? '&' : '?') + 'v=' + Date.now();

    loadTimer = setTimeout(() => {
      // A timed-out source may be blocked; advance to the next mirror.
      loadNext();
    }, 12000);
  }

  desktop.addEventListener('load', () => {
    clearTimeout(loadTimer);
    // Let the new document begin painting before removing the cover.
    requestAnimationFrame(() => requestAnimationFrame(() => { status.hidden = true; }));
  });

  desktop.addEventListener('error', loadNext);
  retry.addEventListener('click', () => {
    attempt = 0;
    loadNext();
  });

  loadNext();
})();
</script>
</body>
</html>
