      <stop offset=".38" stop-color="#eee9ff"/>
      <stop offset=".72" stop-color="#c9bdff"/>
      <stop offset="1" stop-color="#8f83e8"/>
    </linearGradient>
    <linearGradient id="moon" x1="37" y1="12" x2="54" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf2"/>
      <stop offset=".45" stop-color="#e7e0ff"/>
      <stop offset="1" stop-color="#a7b5ff"/>
    </linearGradient>
    <radialGradient id="halo" cx="72%" cy="31%" r="52%">
