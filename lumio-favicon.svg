<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lumio">
  <defs>
    <linearGradient id="bg" x1="5" y1="3" x2="60" y2="63" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25283a"/>
      <stop offset=".48" stop-color="#111522"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="letter" x1="13" y1="8" x2="39" y2="54" gradientUnits="userSpaceOnUse">
