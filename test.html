<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06152e">
<title>LIGHTSPEED ARCHIVE</title>
<style>
:root{color-scheme:dark;--ice:#d8f2ff;--blue:#62bdff}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#174e83 0%,#0a2b52 38%,#06152e 76%,#030914 100%);font-family:"Courier New",monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#02091635 4px 5px)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,#02071399 100%)}
main{position:relative;z-index:1;width:100%;padding:24px;text-align:center}
h1{display:inline-block;margin:0;color:var(--ice);font-size:clamp(2rem,8vw,6.6rem);font-weight:900;letter-spacing:.1em;line-height:1.1;text-shadow:0 0 5px #d8f2ff,0 0 18px #62bdffb0,0 0 44px #168bff80;cursor:pointer;user-select:none;overflow-wrap:anywhere;transition:transform .2s ease,text-shadow .2s ease,color .2s ease}
h1:hover,h1:focus-visible{transform:scale(1.025);text-shadow:0 0 8px white,0 0 24px #62bdff,0 0 58px #168bff;outline:none}
h1.active{color:#fff;text-shadow:3px 0 #62bdff,-3px 0 #a4e8ff,0 0 28px #168bff,0 0 70px #168bff}
@media(prefers-reduced-motion:reduce){h1{transition:none}}
</style>
</head>
<body>
<main>
<h1 id="archive-title" tabindex="0" role="button" aria-label="LIGHTSPEED ARCHIVE. Toggle neon effect">LIGHTSPEED<br>ARCHIVE</h1>
</main>
<script>
const title=document.getElementById("archive-title");
function toggleGlow(){title.classList.toggle("active")}
title.addEventListener("click",toggleGlow);
title.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();toggleGlow()}});
</script>
</body>
</html>
