<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Lightspeed</title>
<style>
:root{color-scheme:dark;--black:#08090b;--white:#fff;--ink:#17191c;--muted:#6b7178;--line:#d9dde1;--green:#168044}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{background:var(--black);color:#f5f6f7}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #168044;outline-offset:4px}
.page{min-height:100svh;display:grid;place-items:center;padding:24px}
#gate{width:min(720px,100%);text-align:center;transition:opacity .32s ease,transform .32s ease}
.mark{margin:0;color:#f4f5f6;font-size:clamp(3rem,11vw,7rem);font-weight:850;letter-spacing:-.09em;line-height:.9}
.gate-label{margin:24px 0 32px;color:#9ba1a8;font-size:.72rem;letter-spacing:.16em}
.escape-btn{min-height:50px;padding:0 22px;border:1px solid #f4f5f6;border-radius:3px;background:#f4f5f6;color:#090a0b;font-weight:700;cursor:pointer;transition:background .18s,color .18s}
.escape-btn:hover{background:#b9f6ca;border-color:#b9f6ca}
#terminal{display:none;width:min(920px,100%);color:var(--ink);background:var(--white);padding:clamp(20px,4vw,42px);animation:enter .35s ease both}
.terminal-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.prompt{display:flex;align-items:center;gap:9px;color:#252a2f}
.prompt-mark{color:var(--green);font-weight:900}
h2{margin:30px 0 7px;font-size:clamp(1.7rem,5vw,2.7rem);letter-spacing:-.07em;line-height:1.05}
.path{font-size:.74rem;color:var(--muted);margin-bottom:24px}
.link-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.link-card{min-height:132px;display:flex;flex-direction:column;justify-content:space-between;padding:17px 18px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid #cfd4d8;border-radius:2px;transition:border-color .16s,background .16s,transform .16s}
.link-card:hover{border-color:#20252a;background:#f6f8f7;transform:translateY(-2px)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-index{font-size:.68rem;color:var(--muted)}
.arrow{font-size:1rem;color:#343a40}
.card-name{font-size:.95rem;font-weight:750}
.card-url{margin-top:6px;font-size:.68rem;color:var(--muted);overflow-wrap:anywhere}
.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding-top:13px;border-top:1px solid var(--line);font-size:.65rem;color:var(--muted)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding:14px}#terminal{padding:20px 15px}.link-grid{grid-template-columns:1fr}.link-card{min-height:108px}.terminal-bar{font-size:.63rem}h2{margin-top:25px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <section id="gate" aria-label="Lightspeed">
    <h1 class="mark">LIGHTSPEED</h1>
    <p class="gate-label">ACADEMIC JAIL</p>
    <button class="escape-btn" id="escape" type="button">Escape Academic Jail <span aria-hidden="true">↗</span></button>
  </section>

  <section id="terminal" aria-label="Link launcher" aria-hidden="true">
    <header class="terminal-bar">
      <div class="prompt"><span class="prompt-mark" aria-hidden="true">›_</span><span>lightspeed@localhost</span></div>
      <span>~/links</span>
    </header>
    <h2>Links<span style="color:var(--green)">.</span></h2>
    <div class="path">/home/user/shortcuts</div>
    <nav class="link-grid" aria-label="Web links">
      <a class="link-card" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
        <div class="card-head"><span class="card-index">01 / WEB</span><span class="arrow" aria-hidden="true">↗</span></div>
        <div><div class="card-name">Google</div><div class="card-url">google.com</div></div>
      </a>
      <a class="link-card" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <div class="card-head"><span class="card-index">02 / MEDIA</span><span class="arrow" aria-hidden="true">↗</span></div>
        <div><div class="card-name">YouTube</div><div class="card-url">youtube.com</div></div>
      </a>
      <a class="link-card" href="https://github.com/" target="_blank" rel="noopener noreferrer">
        <div class="card-head"><span class="card-index">03 / CODE</span><span class="arrow" aria-hidden="true">↗</span></div>
        <div><div class="card-name">GitHub</div><div class="card-url">github.com</div></div>
      </a>
      <a class="link-card" href="https://www.wikipedia.org/" target="_blank" rel="noopener noreferrer">
        <div class="card-head"><span class="card-index">04 / REFERENCE</span><span class="arrow" aria-hidden="true">↗</span></div>
        <div><div class="card-name">Wikipedia</div><div class="card-url">wikipedia.org</div></div>
      </a>
    </nav>
    <footer class="bottom"><span>LIGHTSPEED</span><span>4 SHORTCUTS</span></footer>
  </section>
</main>
<script>
(() => {
  const gate = document.getElementById("gate");
  const terminal = document.getElementById("terminal");
  const escapeButton = document.getElementById("escape");

  escapeButton.addEventListener("click", () => {
    gate.style.opacity = "0";
    gate.style.transform = "translateY(-8px)";
    gate.setAttribute("aria-hidden", "true");
    escapeButton.disabled = true;

    window.setTimeout(() => {
      gate.hidden = true;
      terminal.style.display = "block";
      terminal.setAttribute("aria-hidden", "false");
      terminal.querySelector("a").focus({ preventScroll: true });
    }, 320);
  });
})();
</script>
</body>
</html>
