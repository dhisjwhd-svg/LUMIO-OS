<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>Lightspeed</title>
<style>
:root{color-scheme:dark;--bg:#08090b;--panel:#111316;--line:#292d32;--text:#f0f2f4;--muted:#9299a2;--green:#b9f6ca}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
body{background:var(--bg);color:var(--text)}
button,a{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:4px}
.page{min-height:100vh;display:grid;place-items:center;padding:28px}
#gate{width:min(680px,100%);text-align:center;transition:opacity .35s,transform .35s}
.mark{font-size:clamp(2.8rem,9vw,6.8rem);font-weight:850;letter-spacing:-.085em;line-height:.95;margin:0;color:#f4f6f7}
.gate-sub{font-size:.76rem;color:#9299a2;margin:22px 0 30px;letter-spacing:.1em}
.escape-btn{min-height:52px;padding:0 22px;background:#f0f2f4;color:#090a0b;border:0;border-radius:4px;font-weight:750;cursor:pointer;transition:background .18s,transform .18s}
.escape-btn:hover{background:var(--green);transform:translateY(-2px)}
#terminal{display:none;width:min(940px,100%);padding:28px 0;animation:appear .45s ease both}
.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:.72rem}
.linux-mark{display:flex;align-items:center;gap:10px;color:#f2f3f4;font-weight:750;letter-spacing:.04em}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 12px #b9f6ca45}
h2{font-size:clamp(1.8rem,5vw,3.2rem);letter-spacing:-.07em;margin:34px 0 8px;font-weight:760}
.intro{margin:0 0 28px;color:var(--muted);font-size:.83rem;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.link-card{display:flex;flex-direction:column;gap:28px;min-height:150px;padding:19px;text-decoration:none;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;transition:border-color .2s,background .2s,transform .2s}
.link-card:hover{border-color:#6c8274;background:#151a17;transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-icon{width:34px;height:34px;display:grid;place-items:center;border:1px solid #383d43;border-radius:5px;color:var(--green);font-size:1rem}
.out{color:#7d858e;font-size:1rem}
.card-title{font-size:.95rem;font-weight:700;margin-bottom:7px}
.card-desc{font-size:.72rem;line-height:1.6;color:var(--muted)}
.footer{margin-top:24px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:#747b84;font-size:.67rem}
@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:520px){.page{padding:20px}.grid{grid-template-columns:1fr}.link-card{min-height:125px;gap:20px}#terminal{padding:10px 0}.topline{font-size:.65rem}h2{margin-top:27px}.footer{font-size:.6rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
<section id="gate" aria-label="Escape screen">
  <h1 class="mark">LIGHTSPEED</h1>
  <p class="gate-sub">ACADEMIC JAIL</p>
  <button class="escape-btn" id="escape" type="button">Escape Academic Jail <span aria-hidden="true">↗</span></button>
</section>
<section id="terminal" aria-label="Link dashboard">
  <div class="topline">
    <div class="linux-mark"><span class="dot" aria-hidden="true"></span> lightspeed@localhost</div>
    <span>~/links</span>
  </div>
  <h2>Quick links<span style="color:var(--green)">.</span></h2>
  <p class="intro">Choose where to go.</p>
  <nav class="grid" aria-label="Quick links">
    <a class="link-card" href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
      <div class="card-top"><span class="card-icon" aria-hidden="true">⌕</span><span class="out" aria-hidden="true">↗</span></div>
      <div><div class="card-title">Google</div><div class="card-desc">Search the web</div></div>
    </a>
    <a class="link-card" href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
      <div class="card-top"><span class="card-icon" aria-hidden="true">▶</span><span class="out" aria-hidden="true">↗</span></div>
      <div><div class="card-title">YouTube</div><div class="card-desc">Videos and music</div></div>
    </a>
    <a class="link-card" href="https://github.com/" target="_blank" rel="noopener noreferrer">
      <div class="card-top"><span class="card-icon" aria-hidden="true">⌘</span><span class="out" aria-hidden="true">↗</span></div>
      <div><div class="card-title">GitHub</div><div class="card-desc">Projects and code</div></div>
    </a>
    <a class="link-card" href="https://www.wikipedia.org/" target="_blank" rel="noopener noreferrer">
      <div class="card-top"><span class="card-icon" aria-hidden="true">文</span><span class="out" aria-hidden="true">↗</span></div>
      <div><div class="card-title">Wikipedia</div><div class="card-desc">Explore topics</div></div>
    </a>
  </nav>
  <div class="footer"><span>LIGHTSPEED</span><span>4 LINKS</span></div>
</section>
</div>
<script>
const gate=document.getElementById("gate");
const terminal=document.getElementById("terminal");
document.getElementById("escape").addEventListener("click",()=>{
  gate.style.opacity="0";
  gate.style.transform="translateY(-8px)";
  gate.setAttribute("aria-hidden","true");
  window.setTimeout(()=>{
    gate.style.display="none";
    terminal.style.display="block";
    terminal.querySelector("a").focus({preventScroll:true});
  },350);
});
</script>
</body>
</html>
