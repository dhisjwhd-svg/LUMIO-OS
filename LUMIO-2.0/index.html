<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>LUMIO 2.0 — Standalone</title>
<style>
:root{color-scheme:dark;--bg:#09090d;--surface:rgba(22,22,29,.78);--surface-2:#191920;--line:rgba(255,255,255,.1);--text:#f5f4f8;--muted:#92919d;--accent:#c6b6ff;--accent-rgb:198,182,255;--shadow:0 28px 90px #0009;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(ellipse at 50% -18%,#30283e 0,transparent 47%),radial-gradient(ellipse at 95% 90%,#1b1c2a 0,transparent 38%),linear-gradient(145deg,#0c0c12,#050507);color:var(--text);user-select:none}button,input,textarea,select{font:inherit}button{color:inherit}.desktop{position:fixed;inset:0;padding:28px 34px 100px}.topbar{height:42px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:850;letter-spacing:.2em;color:#fff}.brand span{color:var(--accent)}.top-right{display:flex;align-items:center;gap:16px;color:#e7e4ed;font-size:12px}.status-dot{width:7px;height:7px;background:#91d7b0;border-radius:50%;box-shadow:0 0 12px #91d7b080}.clock{text-align:right;font-variant-numeric:tabular-nums}.desktop-label{margin:44px 0 18px;color:#a6a2b1;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,104px));gap:20px 14px;max-width:690px}.app-tile{border:1px solid transparent;background:transparent;padding:10px 5px;border-radius:15px;display:grid;justify-items:center;gap:10px;cursor:pointer;transition:.18s}.app-tile:hover{background:#ffffff0b;border-color:#ffffff12;transform:translateY(-2px)}.app-icon{width:62px;height:62px;border:1px solid #ffffff18;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,#292832,#14141a);box-shadow:0 12px 28px #0006;color:var(--app-accent,var(--accent));font-size:25px;font-weight:750}.app-name{font-size:12px;color:#e9e7ef}.dock{position:fixed;z-index:500;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid #ffffff20;border-radius:20px;background:rgba(17,17,23,.78);backdrop-filter:blur(28px) saturate(150%);box-shadow:0 18px 60px #0009}.dock-start,.dock-app{width:39px;height:39px;border:1px solid #ffffff14;border-radius:12px;background:#ffffff0a;display:grid;place-items:center;cursor:pointer}.dock-start{font-size:17px;color:var(--accent)}.dock-items{display:flex;gap:6px}.dock-app{font-size:18px}.dock-app.active{background:rgba(var(--accent-rgb),.18);border-color:rgba(var(--accent-rgb),.42)}.dock-sep{width:1px;height:25px;background:#ffffff20;margin:0 2px}.window-layer{position:fixed;inset:0;z-index:100;pointer-events:none}.window{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 28px));height:min(520px,calc(100vh - 130px));min-width:min(310px,calc(100vw - 20px));min-height:220px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #ffffff25;border-radius:17px;background:rgba(19,19,25,.96);box-shadow:var(--shadow);backdrop-filter:blur(28px);pointer-events:auto;animation:windowIn .18s ease-out}.window[hidden]{display:none}@keyframes windowIn{from{opacity:0;scale:.97}to{opacity:1;scale:1}}.window.maximized{left:14px!important;top:14px!important;transform:none!important;width:calc(100vw - 28px)!important;height:calc(100vh - 100px)!important}.titlebar{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;background:#ffffff08;border-bottom:1px solid var(--line);cursor:grab}.titlebar:active{cursor:grabbing}.window-title{font-size:12px;font-weight:700;letter-spacing:.02em}.window-controls{display:flex;gap:7px}.window-controls button{width:27px;height:27px;border:1px solid #ffffff12;border-radius:8px;background:#ffffff0a;cursor:pointer}.window-controls button:hover{background:#ffffff18}.window-content{flex:1;min-height:0;overflow:auto;padding:20px;user-select:text}.window-content h2{font-size:19px;margin:0 0 7px}.window-content p{font-size:13px;line-height:1.65;color:#aaa8b4}.panel{padding:16px;border:1px solid var(--line);border-radius:13px;background:#ffffff06;margin-bottom:12px}.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.start-menu{position:fixed;z-index:600;left:18px;bottom:78px;width:min(350px,calc(100vw - 36px));max-height:min(560px,calc(100vh - 110px));overflow:auto;padding:13px;border:1px solid #ffffff20;border-radius:17px;background:rgba(20,20,27,.94);backdrop-filter:blur(28px);box-shadow:var(--shadow)}.start-menu[hidden]{display:none}.search{width:100%;padding:12px 13px;border:1px solid #ffffff18;border-radius:10px;background:#09090e;color:white;outline:none}.search:focus,textarea:focus,input:focus,select:focus{border-color:rgba(var(--accent-rgb),.7)!important;outline:none}.start-list{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}.start-item{display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer;font-size:12px}.start-item:hover{background:#ffffff10}.start-glyph{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#ffffff0d;font-size:16px}.toast-area{position:fixed;z-index:900;right:18px;top:18px;display:grid;gap:8px}.toast{padding:12px 15px;border:1px solid #ffffff20;border-radius:12px;background:#1b1b23;box-shadow:var(--shadow);font-size:12px;animation:windowIn .15s ease-out}.btn{padding:9px 12px;border:1px solid #ffffff1c;border-radius:9px;background:#ffffff0b;cursor:pointer;font-size:12px}.btn:hover{background:#ffffff16}.btn.primary{background:rgba(var(--accent-rgb),.18);border-color:rgba(var(--accent-rgb),.4)}.field{width:100%;padding:10px 11px;border:1px solid #ffffff18;border-radius:9px;background:#09090e;color:#fff}.field-label{display:grid;gap:7px;font-size:12px;color:#d5d2dd;margin:12px 0}.notes-area{width:100%;height:260px;resize:vertical;padding:13px;border:1px solid var(--line);border-radius:11px;background:#0b0b10;color:#f5f4f8;line-height:1.6}.file-list{padding-left:18px;color:#ddd;font-size:12px;line-height:2}.calc{max-width:320px;margin:auto}.calc-display{width:100%;padding:18px 12px;margin-bottom:10px;border:1px solid var(--line);border-radius:12px;background:#09090e;text-align:right;font-size:27px;color:white}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.calc-grid button{height:48px;border:1px solid var(--line);border-radius:10px;background:#ffffff0b;font-size:15px;cursor:pointer}.calc-grid button:hover{background:#ffffff18}.terminal{background:#08090c;border:1px solid var(--line);border-radius:10px;padding:14px;font:12px/1.7 ui-monospace,SFMono-Regular,monospace;color:#c9c2df;min-height:230px;white-space:pre-wrap}.terminal-input{display:flex;gap:8px;margin-top:10px}.terminal-input input{flex:1;min-width:0}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #ffffff10;font-size:12px}.setting-row:last-child{border:0}.switch{accent-color:var(--accent);width:16px;height:16px}.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:25px;height:25px;border-radius:50%;border:2px solid #ffffff55;cursor:pointer}.empty{padding:35px 12px;text-align:center;color:var(--muted);font-size:12px}.welcome{max-width:620px}.welcome h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.05em;margin:10px 0}.welcome .lead{font-size:14px;color:#b5b2bf;max-width:490px}.welcome-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px}.welcome-card{padding:15px;border:1px solid var(--line);border-radius:13px;background:#ffffff07}.welcome-card strong{display:block;font-size:13px;margin:8px 0 4px}.welcome-card p{font-size:11px;margin:0}.reduce-motion *, .reduce-motion *:before,.reduce-motion *:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
@media(max-width:600px){.desktop{padding:22px 16px 95px}.desktop-label{margin-top:34px}.app-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 5px}.app-icon{width:57px;height:57px}.top-right{gap:9px}.window{top:10%!important;left:10px!important;transform:none!important;width:calc(100vw - 20px)!important;height:76vh!important}.window.maximized{top:8px!important;left:8px!important;width:calc(100vw - 16px)!important;height:calc(100vh - 90px)!important}.window-content{padding:15px}.welcome-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="desktop" id="desktop">
 <header class="topbar"><div class="brand">LUMIO<span>.</span></div><div class="top-right"><span class="status-dot"></span><span>LOCAL SESSION</span><div class="clock"><div id="clock">--:--</div><div id="date" class="muted">---</div></div></div></header>
 <div class="desktop-label">Your desktop</div><section class="app-grid" id="appGrid" aria-label="Applications"></section>
</main>
<nav class="dock" aria-label="Dock"><button class="dock-start" id="startButton" title="Applications">✣</button><div class="dock-items" id="dockItems"></div><div class="dock-sep"></div><button class="dock-app" id="dockSettings" title="Settings">⚙</button></nav>
<section class="window-layer" id="windowLayer"></section>
<aside class="start-menu" id="startMenu" hidden><input class="search" id="appSearch" placeholder="Search applications…" autocomplete="off"><div class="start-list" id="startList"></div></aside>
<div class="toast-area" id="toastArea" aria-live="polite"></div>
<script>
(()=> {
"use strict";
const $=(s,root=document)=>root.querySelector(s);
const state={windows:new Map(),z:20,notes:load("notes",""),accent:load("accent","#c6b6ff"),reduceMotion:load("reduceMotion",false),wallpaper:load("wallpaper","aurora"),history:[]};
function load(k,f){try{const v=localStorage.getItem("lumio.standalone."+k);return v===null?f:JSON.parse(v)}catch{return f}}
function save(k,v){try{localStorage.setItem("lumio.standalone."+k,JSON.stringify(v));return true}catch{return false}}
const apps=[
{id:"home",name:"Overview",icon:"⌂",accent:"#c6b6ff",desc:"LUMIO desktop overview",render:homeApp},
{id:"files",name:"Files",icon:"▤",accent:"#d7c6ff",desc:"Local file picker",render:filesApp},
{id:"notes",name:"Notes",icon:"▧",accent:"#f0ce8b",desc:"A simple local notes space",render:notesApp},
{id:"calculator",name:"Calculator",icon:"＋",accent:"#a8d8c0",desc:"Basic calculator",render:calculatorApp},
{id:"terminal",name:"Terminal",icon:"⌘",accent:"#a8c5ff",desc:"LUMIO command console",render:terminalApp},
{id:"settings",name:"Settings",icon:"⚙",accent:"#d7d7df",desc:"Personalize LUMIO",render:settingsApp},
{id:"about",name:"About LUMIO",icon:"◈",accent:"#d4b9ff",desc:"System information",render:aboutApp}
];
function toast(message){const el=document.createElement("div");el.className="toast";el.textContent=message;$("#toastArea").append(el);setTimeout(()=>el.remove(),2600)}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function button(text,fn,primary=false){const b=el("button","btn"+(primary?" primary":""),text);b.type="button";b.addEventListener("click",fn);return b}
function panel(title,description){const p=el("section","panel");if(title)p.append(el("h2","",title));if(description)p.append(el("p","",description));return p}
function homeApp(root){const wrap=el("div","welcome");wrap.append(el("div","eyebrow","LUMIO 2.0 · STANDALONE EDITION"),el("h1","","A quieter corner of your computer."),el("p","lead","A self-contained desktop shell built in one HTML file. Open tools, manage windows, save notes locally, and personalize your workspace."));const grid=el("div","welcome-grid");[["⌘","A small app system","Launch built-in tools from the desktop, dock, or app menu."],["▣","Window controls","Open, focus, minimize, maximize, and close app windows."],["◌","Local preferences","Your notes and settings stay in this browser on this device."],["◇","One-file portability","The interface, styles, and application logic live in this HTML file."]].forEach(x=>{const c=el("div","welcome-card");c.append(el("div","",x[0]),el("strong","",x[1]),el("p","",x[2]));grid.append(c)});wrap.append(grid);root.append(wrap)}
function filesApp(root){const p=panel("Local files","Choose files from this device. LUMIO only lists files you explicitly select; it does not scan your computer.");const input=el("input","field");input.type="file";input.multiple=true;const list=el("ul","file-list");input.addEventListener("change",()=>{list.replaceChildren();[...(input.files||[])].forEach(f=>list.append(el("li","",f.name+" · "+formatBytes(f.size))));if(!input.files.length)list.append(el("li","","No files selected."))});p.append(input,list);root.append(p)}
function formatBytes(n){if(n<1024)return n+" B";if(n<1048576)return(n/1024).toFixed(1)+" KB";return(n/1048576).toFixed(1)+" MB"}
function notesApp(root){const p=panel("Notes","Autosaves in this browser on this device.");const area=el("textarea","notes-area");area.value=state.notes;area.placeholder="Write something…";const row=el("div","");row.style.cssText="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px";const status=el("span","muted","Saved locally");status.style.fontSize="11px";area.addEventListener("input",()=>{state.notes=area.value;status.textContent=save("notes",state.notes)?"Saved locally":"Could not save — browser storage may be full"});row.append(status,button("Download .txt",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([area.value],{type:"text/plain"}));a.download="lumio-notes.txt";a.click();URL.revokeObjectURL(a.href)}));p.append(area,row);root.append(p)}
function calculatorApp(root){const p=panel("Calculator","Basic arithmetic calculator.");const display=el("div","calc-display","0");display.setAttribute("aria-live","polite");const grid=el("div","calc-grid");let expr="";const keys=["C","(",")","÷","7","8","9","×","4","5","6","−","1","2","3","+","±","0",".","="];function update(){display.textContent=expr||"0"}function press(k){if(k==="C")expr="";else if(k==="="){try{if(!/^[0-9+\-*/().\s]+$/.test(expr))throw Error();const result=Function('"use strict";return ('+expr+')')();if(!Number.isFinite(result))throw Error();expr=String(Number(result.toFixed(10)))}catch{expr="Error"}}else if(k==="±"){if(expr)expr=expr.startsWith("-")?expr.slice(1):"-"+expr}else{if(expr==="Error")expr="";expr+=({"÷":"/","×":"*","−":"-"}[k]||k)}update()}keys.forEach(k=>{const b=el("button","",k);b.addEventListener("click",()=>press(k));grid.append(b)});p.className+=" calc";p.append(display,grid);root.append(p)}
function terminalApp(root){const p=panel("LUMIO Console","A safe, built-in information console. Commands do not execute operating-system processes.");const output=el("div","terminal","LUMIO Console [standalone]\nType help to see available commands.\n");const row=el("div","terminal-input");const input=el("input","field");input.placeholder="Enter a command…";const run=()=>{const cmd=input.value.trim().toLowerCase();if(!cmd)return;output.textContent+="\n> "+cmd+"\n";const responses={help:"Available: help, about, date, apps, clear, status","about":"LUMIO 2.0 — single-file browser desktop prototype.","date":new Date().toString(),"apps":apps.map(a=>a.name).join(" · "),"status":"Browser session active. Local preferences: "+(save("healthcheck",true)?"available":"unavailable")};output.textContent+=cmd==="clear"?"":(responses[cmd]||"Unknown command. Type help.");output.scrollTop=output.scrollHeight;input.value=""};row.append(input,button("Run",run,true));input.addEventListener("keydown",e=>{if(e.key==="Enter")run()});p.append(output,row);root.append(p)}
function settingsApp(root){const p=panel("Appearance","Tune the look and motion of your LUMIO workspace.");const motion=el("div","setting-row");motion.append(el("span","","Reduce motion"),(()=>{const x=el("input","switch");x.type="checkbox";x.checked=state.reduceMotion;x.addEventListener("change",()=>{state.reduceMotion=x.checked;save("reduceMotion",x.checked);document.documentElement.classList.toggle("reduce-motion",x.checked)});return x})());const colors=el("div","setting-row");colors.style.display="block";colors.append(el("div","","Accent color"));const swatches=el("div","swatches");["#c6b6ff","#9ecbff","#a8d8c0","#f0ce8b","#f2a9c5","#ffffff"].forEach(color=>{const s=el("button","swatch");s.style.background=color;s.title=color;s.setAttribute("aria-label","Set accent "+color);s.addEventListener("click",()=>setAccent(color));swatches.append(s)});colors.append(swatches);const wallpaper=el("div","setting-row");wallpaper.style.display="block";wallpaper.append(el("div","","Desktop atmosphere"));const select=el("select","field");[["aurora","Aurora"],["midnight","Midnight"],["graphite","Graphite"]].forEach(([v,t])=>{const o=el("option","",t);o.value=v;select.append(o)});select.value=state.wallpaper;select.addEventListener("change",()=>{state.wallpaper=select.value;save("wallpaper",state.wallpaper);applyWallpaper()});wallpaper.append(select);const data=el("div","setting-row");data.style.display="block";data.append(el("div","","Local data"));data.append(button("Export LUMIO settings",()=>{const data={notes:state.notes,accent:state.accent,reduceMotion:state.reduceMotion,wallpaper:state.wallpaper};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="lumio-settings.json";a.click();URL.revokeObjectURL(a.href)}));p.append(motion,colors,wallpaper,data);root.append(p)}
function aboutApp(root){const p=panel("LUMIO 2.0","A browser-based desktop experience, packaged as a single HTML document.");[["Build","Standalone prototype"],["Architecture","Inline HTML · CSS · JavaScript"],["Storage","Browser localStorage"],["Runtime","Your current web browser"],["System boundary","Not a Linux distribution or native operating system"]].forEach(([k,v])=>{const r=el("div","setting-row");r.append(el("span","muted",k),el("strong","",v));p.append(r)});p.append(el("p","","This app cannot access your whole filesystem or run native programs. The Files app only lists files you select. Notes and preferences are stored locally by your browser."));root.append(p)}
function setAccent(color){state.accent=color;save("accent",color);document.documentElement.style.setProperty("--accent",color);document.documentElement.style.setProperty("--accent-rgb",hexRgb(color));toast("Accent updated")}
function hexRgb(hex){const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255].join(",")}
function applyWallpaper(){const b=document.body;const styles={aurora:"radial-gradient(ellipse at 50% -18%,#30283e 0,transparent 47%),radial-gradient(ellipse at 95% 90%,#1b1c2a 0,transparent 38%),linear-gradient(145deg,#0c0c12,#050507)",midnight:"radial-gradient(ellipse at 20% 0%,#202b43 0,transparent 48%),linear-gradient(145deg,#080d17,#040509)",graphite:"radial-gradient(ellipse at 80% 0%,#303036 0,transparent 42%),linear-gradient(145deg,#161619,#070708)"};b.style.background=styles[state.wallpaper]||styles.aurora}
function openApp(id){const app=apps.find(a=>a.id===id);if(!app)return;let rec=state.windows.get(id);if(rec){rec.node.hidden=false;focusWindow(rec);return}const node=el("section","window");node.dataset.app=id;node.style.zIndex=String(++state.z);const bar=el("header","titlebar");const title=el("span","window-title",app.name);const controls=el("div","window-controls");const min=el("button","","—");min.title="Minimize";min.addEventListener("click",()=>{node.hidden=true;markDock()});const max=el("button","","□");max.title="Maximize / restore";max.addEventListener("click",()=>node.classList.toggle("maximized"));const close=el("button","","×");close.title="Close";close.addEventListener("click",()=>closeWindow(id));controls.append(min,max,close);bar.append(title,controls);const content=el("div","window-content");app.render(content);node.append(bar,content);$("#windowLayer").append(node);rec={node,app};state.windows.set(id,rec);focusWindow(rec);makeDraggable(node,bar);markDock()}
function focusWindow(rec){rec.node.style.zIndex=String(++state.z);rec.node.hidden=false;markDock()}
function closeWindow(id){const rec=state.windows.get(id);if(!rec)return;rec.node.remove();state.windows.delete(id);markDock()}
function markDock(){document.querySelectorAll(".dock-app[data-app]").forEach(b=>{const r=state.windows.get(b.dataset.app);b.classList.toggle("active",!!r&&!r.node.hidden)})}
function makeDraggable(node,bar){let start=null;bar.addEventListener("pointerdown",e=>{if(e.target.closest("button")||node.classList.contains("maximized"))return;start={x:e.clientX,y:e.clientY,left:node.offsetLeft,top:node.offsetTop};bar.setPointerCapture(e.pointerId);node.style.transform="none";node.style.left=start.left+"px";node.style.top=start.top+"px"});bar.addEventListener("pointermove",e=>{if(!start)return;node.style.left=Math.max(0,Math.min(innerWidth-node.offsetWidth,start.left+e.clientX-start.x))+"px";node.style.top=Math.max(0,Math.min(innerHeight-100,start.top+e.clientY-start.y))+"px"});bar.addEventListener("pointerup",()=>{start=null});bar.addEventListener("pointercancel",()=>{start=null});node.addEventListener("pointerdown",()=>focusWindow({node}))}
function tile(app,cls){const b=el("button",cls);b.dataset.app=app.id;b.type="button";const icon=el("span",cls==="app-tile"?"app-icon":"start-glyph",app.icon);if(cls==="app-tile")icon.style.setProperty("--app-accent",app.accent);const name=el("span",cls==="app-tile"?"app-name":"",app.name);b.append(icon,name);b.addEventListener("click",()=>{openApp(app.id);$("#startMenu").hidden=true});return b}
apps.forEach(app=>{$("#appGrid").append(tile(app,"app-tile"));const d=tile(app,"dock-app");d.querySelector(".start-glyph").remove();d.textContent=app.icon;d.title=app.name;$("#dockItems").append(d);$("#startList").append(tile(app,"start-item"))});
$("#startButton").addEventListener("click",()=>{$("#startMenu").hidden=!$("#startMenu").hidden;if(!$("#startMenu").hidden)$("#appSearch").focus()});
$("#dockSettings").addEventListener("click",()=>openApp("settings"));
document.addEventListener("pointerdown",e=>{if(!$("#startMenu").hidden&&!$("#startMenu").contains(e.target)&&!e.target.closest("#startButton"))$("#startMenu").hidden=true});
$("#appSearch").addEventListener("input",e=>{const q=e.target.value.toLowerCase();$("#startList").querySelectorAll("button").forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q))});
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#startMenu").hidden=false;$("#appSearch").focus()}if(e.key==="Escape")$("#startMenu").hidden=true});
function tick(){const d=new Date();$("#clock").textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit"}).format(d);$("#date").textContent=new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric"}).format(d)}tick();setInterval(tick,15000);
document.documentElement.classList.toggle("reduce-motion",state.reduceMotion);setAccent(state.accent);applyWallpaper();
window.LUMIO={version:"2.0-standalone",openApp,closeWindow,listApps:()=>apps.map(({id,name,desc})=>({id,name,desc}))};
})();
</script>
</body>
</html>
