<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumio OS — Loading…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0a1628;color:#c7d5e0;font-family:system-ui,Segoe UI,Arial,sans-serif}
  #loader{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;z-index:99999;
    background:#0a1628;
  }
  .spin{
    width:48px;height:48px;border:4px solid rgba(102,192,244,.2);
    border-top-color:#66c0f4;border-radius:50%;
    animation:sp .7s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  #status{font-size:14px;color:#8f98a0;text-align:center;max-width:320px;line-height:1.4}
  #err{color:#f7768e;display:none;max-width:360px;text-align:center;line-height:1.5}
  #retry{display:none;margin-top:8px;padding:10px 20px;border:0;border-radius:4px;
    background:linear-gradient(to bottom,#75c1e7,#417a9b);color:#fff;font-weight:700;cursor:pointer}
  #retry:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div id="loader">
  <div class="spin"></div>
  <div id="status">Fetching raw GitHub content…</div>
  <div id="err"></div>
  <button id="retry" onclick="load()">Retry</button>
</div>

<script>
(function () {
  // Raw GitHub content of your LUMIO-OS single-file HTML
  const RAW_URL = "https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/ForgedFlowers-PC-FIXED.html";

  const statusEl = document.getElementById("status");
  const errEl = document.getElementById("err");
  const retryBtn = document.getElementById("retry");
  const loader = document.getElementById("loader");

  async function load() {
    statusEl.style.display = "block";
    errEl.style.display = "none";
    retryBtn.style.display = "none";
    statusEl.textContent = "Fetching raw GitHub content…";

    try {
      const res = await fetch(RAW_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status + " — " + res.statusText);

      statusEl.textContent = "Embedding content…";
      const html = await res.text();

      // Completely replace the current document with the fetched HTML
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      statusEl.style.display = "none";
      errEl.style.display = "block";
      errEl.textContent = "Failed to load: " + (e.message || e);
      retryBtn.style.display = "inline-block";
      console.error(e);
    }
  }

  // Start immediately
  load();
})();
</script>
</body>
</html>
