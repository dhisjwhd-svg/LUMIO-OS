<!doctype html><meta charset="utf-8"><script>
fetch("https://raw.githubusercontent.com/dhisjwhd-svg/LUMIO-OS/main/ForgedFlowers-PC-FIXED.html")
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  })
  .then(html => {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(error => {
    document.body.textContent = "Failed to load LUMIO-OS: " + error.message;
  });
</script>
